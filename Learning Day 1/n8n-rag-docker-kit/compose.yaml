services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: DB.rag
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
      - ./sql/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      rag-network:
        aliases:
          - db-rag

volumes:
  rag_pgdata:
    name: DB_rag_data

networks:
  rag-network:
    external: true
    name: rag-network
